# Nginx configuration for the React PWA server (e.g. aezamsk.softmaster95.ru)
# Place this file at /etc/nginx/sites-available/pwa and enable with:
#   ln -s /etc/nginx/sites-available/pwa /etc/nginx/sites-enabled/pwa
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name aezamsk.softmaster95.ru;
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aezamsk.softmaster95.ru;

    # SSL certificates (update paths as needed, e.g. Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/aezamsk.softmaster95.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aezamsk.softmaster95.ru/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/pwa/dist;
    index index.html;

    # Serve the React SPA – fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API calls from the PWA to the main server so the browser
    # sees them as same-origin (avoids CORS altogether).
    # Comment this block out if you prefer to call the main server directly.
    location /api/ {
        proxy_pass         https://moskva.softmaster95.ru;
        proxy_set_header   Host              moskva.softmaster95.ru;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;
}
