[project]
name = "Xatabchik"
version = "2.0"
description = "Remnawave Control Bot для автоматизации продаж VLESS VPN"
dependencies = [
    "aiogram==3.21.0",
    "flask==3.1.1",
    "flask-wtf==1.2.1",
    "httpx==0.27.2",
    "pyotp==2.9.0",
    "python-dotenv==1.1.1",
    "qrcode[pil]==8.2",
    "yookassa==3.5.0",
    "aiosend==2.1.2",
    "aiohttp==3.9.5",
    "aiohttp-sse-client==0.2.1",
    "pytonconnect==0.3.2",
    "paramiko==3.5.0",
    "colorama==0.4.6",
    "psutil==5.9.8",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",
    "bcrypt==4.2.1"
]

[project.optional-dependencies]
dev = [
    "pip-tools",
    "pylint",
    "black",
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
