name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Часть тестов проверяет JS Mini App через node (tests/test_webapp_*).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Модули бэкапа создают /app/project/backups при импорте.
      - name: Prepare /app/project
        run: |
          sudo mkdir -p /app/project
          sudo chown -R "$USER" /app

      - name: Install
        run: |
          python -m pip install -U pip wheel
          python -m pip install -e ".[dev]"

      - name: Pytest
        run: python -m pytest tests -q -p no:cacheprovider
