<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Вход в Панель управления</title>
		<meta name="csrf-token" content="{{ csrf_token() }}" />
		<meta name="theme-color" content="#0b0d10" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='css/style.css') }}"
		/>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='css/admin-theme.css') }}"
		/>
		<style>
			#login-form .form-group label {
				font-size: 0.85rem !important;
				font-weight: 500 !important;
				margin-bottom: 0.35rem !important;
			}

			#login-form input[type="text"],
			#login-form input[type="password"] {
				font-size: 0.95rem !important;
				padding: 0.7rem 0.95rem !important;
				border-radius: 14px !important;
				min-height: 2.75rem;
				width: 100%;
				box-sizing: border-box;
			}

			#login-form .password-field input {
				padding-right: 3rem !important;
			}

			#login-form input[type="checkbox"] {
				width: 1.25rem !important;
				height: 1.25rem !important;
			}

			#login-form .button-primary {
				font-size: 0.95rem !important;
				padding: 0.75rem 1rem !important;
				border-radius: 14px !important;
				min-height: 2.75rem;
			}

			#login-form .password-field {
				position: relative !important;
				display: block !important;
				width: 100% !important;
			}

			#login-form .toggle-password {
				position: absolute !important;
				top: 50% !important;
				right: 8px !important;
				bottom: auto !important;
				left: auto !important;
				transform: translateY(-50%) !important;
				width: 2.25rem !important;
				height: 2.25rem !important;
				margin: 0 !important;
				padding: 0 !important;
				display: inline-flex !important;
				align-items: center !important;
				justify-content: center !important;
				border: 0 !important;
				border-radius: 10px !important;
				background: rgba(255, 255, 255, 0.06) !important;
				color: #f6f7f8 !important;
				-webkit-text-fill-color: #f6f7f8 !important;
				opacity: 1 !important;
				visibility: visible !important;
				z-index: 5 !important;
				cursor: pointer !important;
				-webkit-appearance: none !important;
				appearance: none !important;
				box-shadow: none !important;
				line-height: 1 !important;
			}

			#login-form .toggle-password:hover,
			#login-form .toggle-password:focus-visible {
				background: rgba(255, 255, 255, 0.12) !important;
				color: #ffffff !important;
				outline: none;
			}

			#login-form .toggle-password svg,
			#login-form .toggle-password .eye-icon {
				display: block !important;
				width: 1.25rem !important;
				height: 1.25rem !important;
				flex: 0 0 auto !important;
				pointer-events: none !important;
				opacity: 1 !important;
				visibility: visible !important;
			}

			#login-form .toggle-password svg {
				fill: currentColor !important;
				stroke: none !important;
			}

			#login-form .form-group {
				margin-bottom: 0.9rem !important;
			}

			@media (max-width: 480px) {
				#login-form input[type="text"],
				#login-form input[type="password"] {
					font-size: 1rem !important;
					min-height: 2.85rem;
				}
				#login-form .button-primary {
					font-size: 1rem !important;
					min-height: 2.95rem;
				}
				#login-form .toggle-password {
					width: 2.4rem !important;
					height: 2.4rem !important;
				}
			}
		</style>
	</head>
	<body class="login-page">
		<div class="login-container">
			<h1>Вход в панель</h1>

			{% with messages = get_flashed_messages(with_categories=true) %} {% if
			messages %} {% for category, message in messages %}
			<div class="flash flash-{{ category }}">{{ message }}</div>
			{% endfor %} {% endif %} {% endwith %}

			<form method="post" id="login-form">
				<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
				<div class="form-group">
					<label for="username">Логин:</label>
					<input type="text" id="username" name="username" required autocomplete="username" />
				</div>
				<div class="form-group password-wrapper">
					<label for="password">Пароль:</label>
					<div class="password-field">
						<input type="password" id="password" name="password" required autocomplete="current-password" />
						<button type="button" id="toggle-login-pass" class="toggle-password" aria-label="Показать пароль" title="Показать пароль" aria-pressed="false">
							<!-- filled eye (visible) -->
							<svg class="eye-icon" id="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M12 5c-5.05 0-9.27 3.11-11 7 1.73 3.89 5.95 7 11 7s9.27-3.11 11-7c-1.73-3.89-5.95-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/>
							</svg>
							<!-- filled eye-off (hidden by default) -->
							<svg class="eye-icon" id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" hidden>
								<path d="M3.28 2.22 2.22 3.28l3.01 3.01C3.53 7.5 2.14 9.07 1 12c1.73 3.89 5.95 7 11 7 1.9 0 3.68-.44 5.26-1.2l3.46 3.46 1.06-1.06L3.28 2.22zM12 17c-3.87 0-7.16-2.24-8.72-5 0.78-1.39 1.95-2.6 3.36-3.45l1.64 1.64A4.48 4.48 0 0 0 7.5 12 4.5 4.5 0 0 0 12 16.5c.7 0 1.36-.16 1.95-.44l1.5 1.5C14.55 16.85 13.32 17 12 17zm8.72-5c-.55.98-1.28 1.86-2.14 2.6l-1.52-1.52c.45-.6.73-1.32.8-2.1.1-1.24-.32-2.42-1.1-3.32l1.5-1.5C20.05 7.4 21.22 8.61 22 10c-.4.72-.9 1.39-1.28 2zM12 7.5c.5 0 .97.1 1.4.27L11.1 9.07A2.5 2.5 0 0 0 9.07 11.1L7.77 9.8A4.48 4.48 0 0 1 12 7.5z"/>
							</svg>
						</button>
					</div>
				</div>
				<div class="form-group" style="display:flex;align-items:center;gap:10px;justify-content:space-between;margin:10px 0 16px;">
					<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
						<input type="checkbox" id="remember_me" />
						<span>Запомнить меня</span>
					</label>
				</div>
				<button type="submit" class="button button-primary" style="width: 100%">
					Войти
				</button>
			</form>
		</div>
	<script>
		(function(){
			const btn = document.getElementById('toggle-login-pass');
			const input = document.getElementById('password');
			if (!btn || !input) return;
			const eye = document.getElementById('icon-eye');
			const eyeOff = document.getElementById('icon-eye-off');

			function setVisible(show){
				input.type = show ? 'text' : 'password';
				btn.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
				btn.setAttribute('title', show ? 'Скрыть пароль' : 'Показать пароль');
				btn.setAttribute('aria-pressed', show ? 'true' : 'false');
				if (eye) {
					if (show) eye.setAttribute('hidden', '');
					else eye.removeAttribute('hidden');
					eye.style.display = show ? 'none' : 'block';
				}
				if (eyeOff) {
					if (show) eyeOff.removeAttribute('hidden');
					else eyeOff.setAttribute('hidden', '');
					eyeOff.style.display = show ? 'block' : 'none';
				}
			}

			setVisible(false);
			btn.addEventListener('click', function(){
				setVisible(input.type === 'password');
			});
		})();

		(function(){
			const u = document.getElementById('username');
			const r = document.getElementById('remember_me');
			if (!u || !r) return;
			try {
				const saved = localStorage.getItem('login_username');
				if (saved) { u.value = saved; r.checked = true; }
			} catch(_){}
			u.form && u.form.addEventListener('submit', function(){
				try {
					if (r.checked) localStorage.setItem('login_username', u.value || '');
					else localStorage.removeItem('login_username');
				} catch(_){}
			});
		})();
	</script>
	</body>
</html>
